[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#F3F6FB"
secondaryBackgroundColor = "#FFFFFF"
textColor = "#172033"
linkColor = "#1D4ED8"
borderColor = "#DCE3EE"
showWidgetBorder = true
baseRadius = "large"
font = "sans-serif"
chartCategoricalColors = ["#2563EB", "#7C3AED", "#0891B2", "#059669", "#DB2777", "#EA580C"]

[server]
headless = true

[browser]
gatherUsageStats = false
